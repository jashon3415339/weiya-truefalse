<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FFF9F0">
<title>真的還假的？</title>
<style>
  /* 視覺設計：依 ChatGPT「尾牙｜真的還假的？UI 設計稿」 */
  :root{
    --ink:#16213E; --navy:#101A36; --night:#091126; --paper:#FFF9F0;
    --gold:#FFC84B; --gold-deep:#DE8F20; --red:#E74C54; --red-deep:#B82642;
    --green:#1CBF83; --green-deep:#087C59; --blue:#4E7CFF; --mist:#EAF0FF;
    --muted:#61708D; --line:#DCE3EF; --white:#FFFFFF;
    --shadow:0 14px 34px rgba(12,25,59,.16);
    --font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:var(--font);color:var(--ink);background:var(--paper);overflow:hidden}
  button{font:inherit;cursor:pointer;border:0}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;font-size:14px;min-height:46px}
  .top .me{font-weight:900;max-width:58%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dot{width:11px;height:11px;border-radius:50%;background:var(--green);display:inline-block;box-shadow:0 0 0 3px #1cbf8326;vertical-align:middle}
  .dot.bad{background:var(--red);box-shadow:0 0 0 3px #e74c5433;animation:blink .8s infinite}
  @keyframes blink{50%{opacity:.25}}
  .langbtn{background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:5px 11px;font-size:13px;font-weight:800;margin-right:9px}
  .page{flex:1;overflow:auto;padding:6px 22px 26px;position:relative}
  .center{min-height:100%;display:flex;flex-direction:column;justify-content:center}

  .eyebrow{font-weight:900;color:var(--blue);font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 7px}
  .phone-title{font-size:30px;line-height:1.18;margin:0 0 11px;letter-spacing:-.02em;font-weight:900}
  .sub{color:var(--muted);font-size:15px;line-height:1.55;margin:0}
  .game-pill,.mode-pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;font-size:13px;font-weight:900;background:#e9efff;color:#304fc2}
  .mode-pill{background:#fff2d6;color:#a35c00}
  .mode-pill.elim{background:#ffe3e5;color:var(--red-deep)}
  .footer-note{color:var(--muted);font-size:13px;text-align:center;margin-top:22px}

  /* 1 選語言 */
  .language-stack{display:grid;gap:14px;margin-top:34px}
  .lang{min-height:96px;border-radius:22px;text-align:left;padding:16px 20px;display:flex;align-items:center;gap:16px;color:var(--ink);background:#fff;border:1px solid var(--line);box-shadow:0 8px 19px #1d2f5d12;font-weight:900;font-size:22px}
  .lang:active{transform:scale(.98)}
  .lang .badge{flex:0 0 54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:20px;font-weight:950;color:#fff;background:linear-gradient(135deg,#527dff,#3559d8)}
  .lang:nth-child(2) .badge{background:linear-gradient(135deg,#2bd398,#0a9669)}
  .lang:nth-child(3) .badge{background:linear-gradient(135deg,#ffcf62,#e89525);color:#4d2800}
  .lang small{display:block;color:var(--muted);font-size:13px;margin-top:3px;font-weight:700}
  .lang.cur{border:2px solid var(--blue);background:#f2f5ff}

  /* 2 輸入名字 */
  .join-art{height:150px;display:grid;place-items:center;font-size:96px;position:relative}
  .join-art::after{content:"✦ ✦ ✦";font-size:24px;color:var(--gold);position:absolute;bottom:4px;letter-spacing:11px}
  .form-card{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 10px 24px #1826530e}
  .field-label{font-size:17px;font-weight:900;display:block;margin-bottom:10px}
  .name-input{width:100%;padding:16px;border-radius:14px;border:2px solid var(--line);background:#f9fbff;font-size:22px;color:var(--ink);outline:0;font-family:inherit}
  .name-input:focus{border-color:var(--blue)}
  .input-hint{font-size:13px;color:var(--muted);margin:8px 0 14px;text-align:right}
  .err{color:var(--red-deep);font-weight:900;min-height:20px;margin:-6px 0 8px}
  .primary{width:100%;padding:18px 16px;background:linear-gradient(135deg,#527dff,#3559d8);color:#fff;border-radius:16px;font-size:21px;font-weight:950;box-shadow:0 7px 15px #456dfd4d}
  .primary:disabled{opacity:.6}

  /* 3 等待 */
  .waiting{text-align:center}
  .avatar{font-size:58px;width:105px;height:105px;display:grid;place-items:center;background:#edf2ff;border-radius:40px;margin:20px auto}
  .joined{display:flex;gap:13px;align-items:center;text-align:left;background:#fff;border:1px solid var(--line);padding:15px;border-radius:18px;margin:24px 0 12px}
  .joined strong{font-size:22px;display:block}
  .joined span{color:var(--muted);font-size:13px}
  .count-card{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .stat{background:var(--navy);color:#fff;border-radius:18px;padding:15px;text-align:left}
  .stat.gold{background:linear-gradient(135deg,#ffcf62,#e89525);color:#4d2800}
  .stat b{font-size:28px;display:block;line-height:1.15}
  .stat small{font-size:12px;font-weight:800;opacity:.85}

  /* 4 作答 */
  .question-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 16px}
  .round{font-size:15px;font-weight:950;color:var(--ink);background:#e9efff;border-radius:99px;padding:8px 13px}
  .timer{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;position:relative;font-size:22px;font-weight:950;background:conic-gradient(var(--gold) 0 var(--deg,360deg),#e8edf7 var(--deg,360deg))}
  .timer::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--paper)}
  .timer b{position:relative;z-index:1}
  .timer.low{background:conic-gradient(var(--red) 0 var(--deg,360deg),#e8edf7 var(--deg,360deg));color:var(--red-deep);animation:beat .5s infinite}
  @keyframes beat{50%{transform:scale(1.08)}}
  .prepare{background:linear-gradient(145deg,#182a58,#314a90);border-radius:28px;color:#fff;text-align:center;padding:34px 14px 40px;font-weight:900;font-size:22px;min-height:440px;display:flex;flex-direction:column;justify-content:center;gap:10px}
  .prepare b{font-size:160px;line-height:1;display:block;color:var(--gold)}
  .prepare b.tick{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  .prepare small{font-size:16px;opacity:.8;font-weight:700}
  .reveal-in{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
  .question{min-height:190px;border-radius:25px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);padding:22px 20px;display:grid;place-items:center;text-align:center;font-size:27px;font-weight:950;line-height:1.42;letter-spacing:-.02em}
  .question.vi{font-size:24px}
  .answer-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:17px}
  .answer{min-height:153px;border-radius:22px;color:#fff;padding:15px 8px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;font-size:24px;font-weight:950;box-shadow:0 9px 0 rgba(0,0,0,.12),0 13px 20px #13215326;transition:transform .1s,opacity .2s,filter .2s}
  .answer:active{transform:translateY(5px);box-shadow:0 4px 0 rgba(0,0,0,.12)}
  .answer em{font-size:44px;font-style:normal;line-height:1}
  .answer small{font-size:12px;opacity:.9;letter-spacing:.04em}
  .answer.true{background:linear-gradient(145deg,#2bd398,#0a9669)}
  .answer.false{background:linear-gradient(145deg,#f36d6d,#ce344c)}
  .answer:disabled{opacity:.45;filter:saturate(.6)}
  .answer.chosen{opacity:1;filter:none;outline:5px solid var(--gold);outline-offset:3px}
  .answer.dim{opacity:.2}
  .submitted{margin-top:17px;background:#e5edff;color:#1e48bd;border-radius:16px;padding:14px;text-align:center;font-weight:900;font-size:17px;min-height:52px}
  .submitted.warn{background:#ffe3e5;color:var(--red-deep)}
  .submitted:empty{visibility:hidden}

  /* 5 結果 */
  .result{text-align:center;padding-top:10px}
  .result-burst{font-size:76px;line-height:1;animation:bounce 1.6s infinite}
  .result h3{font-size:36px;margin:8px 0 4px;font-weight:950}
  .correct{color:var(--green-deep)} .wrong{color:var(--red-deep)}
  .points{display:inline-block;background:#e3faef;color:var(--green-deep);font-weight:950;font-size:28px;padding:9px 20px;border-radius:999px;margin:6px 0 12px}
  .banner{border-radius:16px;padding:12px;font-weight:900;margin:8px 0}
  .banner.ok{background:#e3faef;color:var(--green-deep)}
  .banner.bad{background:#ffe3e5;color:var(--red-deep)}
  .banner.gold{background:#fff2d6;color:#a35c00}
  .result-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;text-align:left;margin:11px 0}
  .result-card b{font-size:16px}
  .result-card p{font-size:16px;line-height:1.55;margin:6px 0 0;color:var(--ink)}
  .score-row{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .score-box{padding:14px;border-radius:16px;background:#eef3ff;text-align:left}
  .score-box b{display:block;font-size:24px}
  .score-box small{font-weight:800;color:var(--muted)}
  .pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  .shake{animation:shake .5s}
  @keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
  @keyframes bounce{50%{transform:scale(1.1) rotate(-6deg)}}

  /* 6 觀戰 */
  .spectate{text-align:center}
  .spectate-icon{font-size:80px;display:block;margin:6px}
  .spectate-card{margin-top:20px;background:#fff;border:1px solid var(--line);padding:18px;border-radius:22px;text-align:center}
  .spectate-card strong{font-size:21px;line-height:1.4;display:block}
  .spectate-card p{color:var(--ink);line-height:1.5;font-size:16px;margin:8px 0 0}
  .ans-tag{display:inline-block;margin-top:10px;padding:8px 16px;border-radius:99px;font-weight:950;font-size:20px;color:#fff}
  .ans-tag.t{background:var(--green)} .ans-tag.f{background:var(--red)}

  /* 7 結束 */
  .finish{text-align:center}
  .confetti{color:var(--gold);letter-spacing:8px;font-size:26px}
  .medal{font-size:90px;line-height:1;margin:6px 0}
  .champ{font-size:20px;font-weight:950;color:#a66100;background:#fff2d6;border-radius:16px;padding:12px;margin:10px 0 16px}
  .demo{position:fixed;bottom:4px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted);pointer-events:none}
  .hide{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div class="top"><span class="me" id="meName"></span><span><button class="langbtn hide" id="langBtn">🌐</button><span class="dot" id="dot"></span></span></div>
  <div class="page" id="page"></div>
</div>
<div class="demo hide" id="demo">DEMO 單機試玩模式</div>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
(() => {
const { C, DEMO, ROOT, TS, api, $, esc, rid, fmt, charLen, tr, sleep, confetti } = TF;
if (DEMO) $("#demo").classList.remove("hide");

const LS = { get: k => { try { return localStorage.getItem("tf_" + k); } catch (e) { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem("tf_" + k) : localStorage.setItem("tf_" + k, v); } catch (e) {} } };
let pid = LS.get("pid"); if (!pid) { pid = rid(20); LS.set("pid", pid); }
let lang = LS.get("lang");
let view = lang ? "boot" : "lang";   // lang | name | joined | late
let st = null, me = null, offset = 0, lastGid = null, lastRk = null, polls = 0;
let answerState = {};                // rk -> {a, status:'sending'|'sent'|'late'}
let shownResultRk = null, lastRenderKey = "";
const T = (k, v) => tr(lang || "zh", k, v);
const sNow = () => Date.now() + offset;
const P = path => ROOT + "/" + path;

function setDot(ok) { $("#dot").classList.toggle("bad", !ok); }
function qText(q) { return q ? (q[lang] || q.zh) : ""; }
function exText() { return st.ex ? (st.ex[lang] || st.ex.zh) : ""; }
function modePill() { return st.mode === "elim" ? `<span class="mode-pill elim">💀 ${T("modeElimShort")}</span>` : `<span class="mode-pill">🏆 ${T("modeScoreShort")}</span>`; }
function ansTag(a) { return a ? `<span class="ans-tag t">⭕ ${T("T")}</span>` : `<span class="ans-tag f">❌ ${T("F")}</span>`; }

// ---------- 時間校正：寫入伺服器時間並量來回時間 ----------
async function syncClock() {
  if (DEMO) { offset = 0; return; }
  let best = null;
  for (let i = 0; i < 3; i++) {
    try {
      const t0 = Date.now(); const r = await api.put(P("clock/" + pid), TS); const t1 = Date.now();
      if (r.ok && typeof r.data === "number") { const rtt = t1 - t0; if (!best || rtt < best.rtt) best = { rtt, off: r.data - (t0 + t1) / 2 }; }
    } catch (e) {}
    await sleep(150);
  }
  if (best) offset = best.off;
}

async function fetchMe() {
  try { me = await api.get(P("players/" + pid)); setDot(true); } catch (e) { setDot(false); }
  return me;
}

// ---------- 主迴圈：每 1.5 秒問一次狀態 ----------
async function poll() {
  try {
    st = await api.get(P("state")) || { phase: "lobby" };
    setDot(true);
  } catch (e) { setDot(false); setTimeout(poll, 1500); return; }
  polls++;
  if (st.gid !== lastGid) {             // 主持人重新開始
    if (lastGid != null) { answerState = {}; shownResultRk = null; }
    lastGid = st.gid;
    if (view === "joined" || view === "late") await fetchMe();
  }
  if (view === "joined") {
    const needMe =
      ((st.phase === "reveal" || st.phase === "board") && !(me && me.last && me.last.rk === st.rk) && !(me && me.out && me.outRk !== st.rk)) ||
      (st.phase === "end" && polls % 3 === 0) ||
      (st.phase === "lobby" && (!me || !me.dn || polls % 4 === 0)) ||
      (st.rk !== lastRk);
    if (needMe) {
      await fetchMe();
      if (!me) { view = "name"; }         // 主持人清空玩家
    }
  }
  if (view === "late" && st.phase === "lobby") { view = "name"; }
  lastRk = st.rk;
  render();
  setTimeout(poll, 1500);
}

// ---------- 畫面 ----------
function setPage(html, key) {
  if (key && key === lastRenderKey) return false;
  lastRenderKey = key || Math.random();
  $("#page").innerHTML = html; $("#page").scrollTop = 0; return true;
}
function topBar() {
  $("#meName").textContent = (view === "joined" && me) ? "👤 " + (me.dn || me.name || "") : (view === "late" ? "👀 " + T("spectate") : "");
  $("#langBtn").classList.toggle("hide", view === "lang");
  $("#langBtn").textContent = "🌐 " + ({ zh: "中文", en: "EN", vi: "VI" }[lang] || "");
}

function render() {
  topBar();
  if (view === "lang") return renderLang();
  if (view === "boot") return;
  if (view === "name") {
    if (st && st.phase && st.phase !== "lobby") { view = "late"; }
    else return renderName();
  }
  if (!st) return;
  if (view === "late") return renderSpectate(true);
  if (!me) return;
  if (st.phase === "lobby") return renderWaiting();
  const outBefore = me.out && me.outRk !== st.rk;
  if (st.phase === "answer") return outBefore ? renderSpectate(false) : renderAnswer();
  if (st.phase === "reveal" || st.phase === "board") {
    if (me.last && me.last.rk === st.rk) return renderResult();
    if (outBefore) return renderSpectate(false);
    return setPage(`<div class="center" style="text-align:center"><div class="result-burst">⏳</div><h2 class="phone-title" style="margin-top:14px">${T("waitResult")}</h2></div>`, "wr" + st.rk + lang);
  }
  if (st.phase === "end") return renderEnd();
  return renderSpectate(false);
}

// 1 選語言
let afterLangView = null;
function renderLang() {
  setPage(`<div class="center">
    <div><span class="game-pill">🎊 尾牙互動遊戲 · Year-end party</span></div>
    <div style="margin-top:34px"><p class="eyebrow">Welcome / Chào mừng</p>
      <h1 class="phone-title">真的還假的？</h1>
      <p class="sub">選擇語言 · Choose language · Chọn ngôn ngữ</p></div>
    <div class="language-stack">
      <button class="lang ${lang === "zh" ? "cur" : ""}" data-l="zh"><span class="badge">中</span><span>繁體中文<small>中文介面</small></span></button>
      <button class="lang ${lang === "en" ? "cur" : ""}" data-l="en"><span class="badge">EN</span><span>English<small>English interface</small></span></button>
      <button class="lang ${lang === "vi" ? "cur" : ""}" data-l="vi"><span class="badge">VI</span><span>Tiếng Việt<small>Giao diện tiếng Việt</small></span></button>
    </div></div>`, "lang" + lang);
  document.querySelectorAll("[data-l]").forEach(b => b.onclick = () => {
    lang = b.dataset.l; LS.set("lang", lang); document.documentElement.lang = lang;
    lastRenderKey = ""; view = afterLangView || "name"; afterLangView = null; render();
  });
}
$("#langBtn").onclick = () => { afterLangView = view; view = "lang"; lastRenderKey = ""; render(); };

// 2 輸入名字
function renderName() {
  if (!setPage(`<p class="eyebrow">${T("title")}</p>
    <h2 class="phone-title">${T("enterName")}</h2>
    <p class="sub">${T("nameSub")}</p>
    <div class="join-art">🎊</div>
    <div class="form-card">
      <label class="field-label" for="nm">${T("yourName")}</label>
      <input class="name-input" id="nm" maxlength="20" autocomplete="off" placeholder="${T("namePh")}" value="${esc(LS.get("name") || "")}">
      <p class="input-hint">${T("namePh")}</p>
      <div class="err" id="err"></div>
      <button class="primary" id="go">${T("join")} →</button>
    </div>`, "name" + lang)) return;
  const go = $("#go"), nm = $("#nm");
  nm.addEventListener("keydown", e => { if (e.key === "Enter") go.click(); });
  go.onclick = async () => {
    const name = nm.value.trim().replace(/\s+/g, " ");
    if (!name) { $("#err").textContent = T("nameReq"); return; }
    if (charLen(name) > 10) { $("#err").textContent = T("nameLong"); return; }
    go.disabled = true; go.textContent = T("joining"); $("#err").textContent = "";
    try {
      const exist = await api.get(P("players/" + pid));
      if (exist) { me = exist; view = "joined"; LS.set("name", exist.name); lastRenderKey = ""; render(); return; }
      const r = await api.put(P("players/" + pid), { name, joinedAt: TS });
      if (r.ok) { LS.set("name", name); view = "joined"; await fetchMe(); lastRenderKey = ""; render(); return; }
      const s = await api.get(P("state"));
      if (s && s.phase !== "lobby") { st = s; view = "late"; lastRenderKey = ""; render(); return; }
      throw new Error("denied");
    } catch (e) {
      $("#err").textContent = T("joinFail"); go.disabled = false; go.textContent = T("join") + " →";
    }
  };
}

// 3 等待
function renderWaiting() {
  setPage(`<div class="center waiting">
    <div>${modePill()}</div>
    <div class="avatar">🙌</div>
    <p class="eyebrow">${T("youIn")}</p>
    <h2 class="phone-title">${T("joined")}</h2>
    <div class="joined"><span style="font-size:32px">👤</span><div><strong>${esc(me.dn || me.name)}</strong><span>${T("yourName")}</span></div></div>
    <div class="count-card">
      <div class="stat"><small>${T("joinedCount")}</small><b>${fmt(st.count || 0)}</b></div>
      <div class="stat gold"><small>🎮</small><b style="font-size:20px;margin-top:6px">${st.mode === "elim" ? T("modeElimShort") : T("modeScoreShort")}</b></div>
    </div>
    <p class="sub" style="margin-top:14px">${esc(st.mode === "elim" ? T("modeElim") : T("modeScore"))}</p>
    <p class="footer-note">${T("autoNext")}</p></div>`, "wait" + (me.dn || me.name) + st.count + st.mode + lang);
}

// 4 作答
let tickTimer = null;
function renderAnswer() {
  const rk = st.rk; const as = answerState[rk] || (LS.get("a_" + rk) ? { a: LS.get("a_" + rk) === "T", status: "sent" } : null);
  if (as) answerState[rk] = as;
  if (setPage(`<div class="question-head"><span class="round">${T("qn", { n: st.qn })}${st.qTotal ? " / " + st.qTotal : ""}</span><div class="timer" id="tm"><b id="tmN"></b></div></div>
    <div class="prepare hide" id="rdy"><span>${T("readyQ")}</span><b id="rdyN"></b><small>${T("cdHint")}</small></div>
    <div id="qArea"><div class="question ${lang === "vi" ? "vi" : ""}" id="qBox"></div>
    <div class="answer-grid" id="ansBox">
      <button class="answer true" data-a="T"><em>⭕</em>${T("T")}<small>${T("alsoT")}</small></button>
      <button class="answer false" data-a="F"><em>❌</em>${T("F")}<small>${T("alsoF")}</small></button>
    </div></div>
    <div class="submitted" id="sent"></div>`, "ans" + rk + lang)) {
    document.querySelectorAll("#ansBox button").forEach(b => b.onclick = () => submit(rk, b.dataset.a === "T"));
  }
  clearInterval(tickTimer); tickTimer = setInterval(() => updateAnswerUI(rk), 200); updateAnswerUI(rk);
}
function updateAnswerUI(rk) {
  if (!st || st.rk !== rk || st.phase !== "answer" || !$("#ansBox")) { clearInterval(tickTimer); return; }
  const now = sNow(), as = answerState[rk];
  const before = now < st.startAt, dur = st.deadline - st.startAt;
  const leftMs = Math.max(0, st.deadline - now), left = Math.ceil(leftMs / 1000);
  const tm = $("#tm");
  $("#tmN").textContent = before ? Math.ceil(dur / 1000) : left;
  tm.style.setProperty("--deg", (before ? 360 : 360 * leftMs / dur) + "deg");
  tm.classList.toggle("low", !before && left <= 3 && left > 0);
  // 倒數期間題目藏起來；倒數結束的同一瞬間才出現題目、開放作答
  $("#rdy").classList.toggle("hide", !before);
  $("#qArea").classList.toggle("hide", before);
  if (before) { const n = String(Math.ceil((st.startAt - now) / 1000)); const el = $("#rdyN"); if (el.textContent !== n) { el.textContent = n; el.classList.remove("tick"); void el.offsetWidth; el.classList.add("tick"); if (navigator.vibrate) navigator.vibrate(20); } }
  else if (!$("#qBox").textContent) { $("#qBox").textContent = qText(st.q); $("#qArea").classList.add("reveal-in"); }
  const closed = now > st.deadline;
  document.querySelectorAll("#ansBox button").forEach(b => {
    const mine = as && ((b.dataset.a === "T") === as.a);
    b.disabled = before || !!as || closed;
    b.classList.toggle("chosen", !!as && mine && as.status !== "late");
    b.classList.toggle("dim", !!as && !mine);
  });
  const s = $("#sent"); s.classList.remove("warn");
  if (as && as.status === "sending") s.textContent = T("sending");
  else if (as && as.status === "sent") s.textContent = `✓ ${T("sent")} · ${T("noChange")}`;
  else if (as && as.status === "late") { s.textContent = T("tooLate"); s.classList.add("warn"); }
  else if (closed) { s.textContent = "⏰ " + T("timeUp"); s.classList.add("warn"); }
  else s.textContent = "";
}
async function submit(rk, a) {
  if (answerState[rk]) return;
  answerState[rk] = { a, status: "sending" }; updateAnswerUI(rk);
  if (navigator.vibrate) navigator.vibrate(30);
  const path = P(`answers/${rk}/${pid}`);
  while (true) {
    try {
      const r = await api.put(path, { a, t: TS });
      if (r.ok) { answerState[rk].status = "sent"; LS.set("a_" + rk, a ? "T" : "F"); setDot(true); break; }
      const ex = await api.get(path).catch(() => null);
      if (ex && typeof ex.a === "boolean") { answerState[rk] = { a: ex.a, status: "sent" }; LS.set("a_" + rk, ex.a ? "T" : "F"); break; }
      answerState[rk].status = "late"; break;
    } catch (e) {
      setDot(false);
      if (sNow() > st.deadline + 800) { answerState[rk].status = "late"; break; }
      await sleep(600);
    }
  }
  updateAnswerUI(rk);
}

// 5 結果
function renderResult() {
  const L = me.last, rk = st.rk;
  const ok = !!L.ok, none = L.a == null;
  let elimLine = "";
  if (st.mode === "elim") {
    if (L.void) elimLine = `<div class="banner gold">😱 ${T("voidR")}</div>`;
    else if (L.outNow) elimLine = `<div class="banner bad">💀 ${T("out")}<br><span style="font-weight:700">${T("outSub")}</span></div>`;
    else if (ok) elimLine = `<div class="banner ok">🛡️ ${T("survive")} · ${T("aliveNow", { n: st.alive || "" })}</div>`;
  }
  const first = shownResultRk !== rk;
  const changed = setPage(`<div class="result">
    <div class="${first ? (ok ? "pop" : "shake") : ""}">
      <div class="result-burst">${ok ? "🎉" : (none ? "⌛" : "😵")}</div>
      <h3 class="${ok ? "correct" : "wrong"}">${ok ? T("correct") : (none ? T("noAns") : T("wrong"))}</h3>
      ${ok ? `<div class="points">+ ${fmt(L.pts)} ${T("pts")}</div>` : ""}
    </div>
    ${elimLine}
    <div class="result-card"><b>${T("answerIs")}：${st.ans ? "⭕ " + T("T") : "❌ " + T("F")}</b><p>${esc(exText())}</p></div>
    <div class="score-row"><div class="score-box"><small>${T("score")}</small><b>${fmt(me.score)}</b></div><div class="score-box"><small>${T("rank")}</small><b>${me.rank ? "# " + me.rank : "-"}<span style="font-size:14px;color:var(--muted)"> / ${st.count || ""}</span></b></div></div>
    <p class="sub" style="margin-top:14px">${st.phase === "board" ? "📺 " + T("look") : T("nextSoon")}</p></div>`,
    "res" + rk + lang + st.phase + me.score + me.rank);
  if (changed && first) { shownResultRk = rk; if (ok) { confetti(90); if (navigator.vibrate) navigator.vibrate([40, 40, 80]); } else if (navigator.vibrate) navigator.vibrate(250); }
}

// 6 觀戰
function renderSpectate(late) {
  const head = late
    ? `<span class="spectate-icon">👀</span><p class="eyebrow">Spectator mode</p><h2 class="phone-title">${T("spectate")}</h2><p class="sub">${T("late")}</p>`
    : `<div>${modePill()}</div><span class="spectate-icon">👀</span><p class="eyebrow">Spectator mode</p><h2 class="phone-title wrong">${T("out")}</h2><p class="sub">${T("outSub")}</p>`;
  let card = "";
  if (st.phase === "lobby") card = `<div class="spectate-card"><strong>⏳ ${T("waitNext")}</strong></div>`;
  else if (st.phase === "answer") card = `<div class="spectate-card"><p class="eyebrow">${T("qn", { n: st.qn })} · <span id="tm"></span></p><strong id="spq"></strong></div>`;
  else if (st.phase === "reveal" || st.phase === "board") card = `<div class="spectate-card"><strong>${esc(qText(st.q))}</strong>${ansTag(st.ans)}<p>${esc(exText())}</p></div>`;
  else if (st.phase === "end") card = `<div class="spectate-card"><strong>🏆 ${T("over")}</strong></div>`;
  const alive = st.mode === "elim" && st.alive && st.phase !== "lobby" ? `<div class="banner gold">${T("aliveNow", { n: st.alive })}</div>` : "";
  setPage(`<div class="center spectate">${head}${card}${alive}<p class="footer-note">📺 ${T("look")}</p></div>`, "spec" + late + st.phase + st.rk + lang + st.alive);
  if (st.phase === "answer") {
    clearInterval(tickTimer);
    tickTimer = setInterval(() => { const tm = $("#tm"); if (!tm || st.phase !== "answer") return clearInterval(tickTimer); const n = sNow(); const bf = n < st.startAt; tm.textContent = bf ? T("ready") + " " + Math.ceil((st.startAt - n) / 1000) : Math.max(0, Math.ceil((st.deadline - n) / 1000)) + "s"; const q = $("#spq"); const want = bf ? "⏳ " + T("readyQ") : qText(st.q); if (q && q.textContent !== want) q.textContent = want; }, 250);
  }
}

// 7 結束
function renderEnd() {
  const r = me.rank, top = r && r <= 3;
  const changed = setPage(`<div class="center finish">
    <div class="confetti">✦ ✦ ✦</div>
    <p class="eyebrow">Game over</p>
    <h2 class="phone-title">${T("over")}</h2>
    <div class="medal">${top ? ["🥇", "🥈", "🥉"][r - 1] : "🎊"}</div>
    ${top ? `<div class="champ">${T("champ", { r })}</div>` : ""}
    <div class="score-row"><div class="score-box"><small>${T("score")}</small><b>${fmt(me.score)}</b></div><div class="score-box"><small>${T("finalRank")}</small><b>${r ? "# " + r : "-"}<span style="font-size:14px;color:var(--muted)"> / ${st.count || ""}</span></b></div></div>
    <p class="footer-note">${T("thanks")}</p></div>`, "end" + r + me.score + lang);
  if (changed && top) confetti(160);
}

// ---------- 啟動 ----------
(async () => {
  try { if ("wakeLock" in navigator) { const req = async () => { try { await navigator.wakeLock.request("screen"); } catch (e) {} }; req(); document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") req(); }); } } catch (e) {}
  if (lang) document.documentElement.lang = lang;
  syncClock(); setInterval(syncClock, 60000);
  if (view === "boot") {
    const ex = await api.get(P("players/" + pid)).catch(() => null);
    if (ex) { me = ex; view = "joined"; } else view = "name";
  }
  render();
  poll();
})();
})();
</script>
</body>
